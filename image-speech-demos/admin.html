<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体験ページの API の設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
main { grid-template-columns: minmax(340px, 1fr) minmax(420px, 1.4fr); }
header label.pass + a.back { margin-left: 0; }
.now { font-size: 30px; font-weight: 900; }
.now.ok { color: #1e8e3e; }
.now.ng { color: var(--ng); }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
input[type=datetime-local] { width: 100%; font-family: var(--font); font-size: 18px; font-weight: 500; padding: 9px 14px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
label.check { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-weight: 900; }
label.check input { width: 22px; height: 22px; accent-color: var(--accent); }
</style>
</head>
<body>
<header>
    <span class="tag api">講師</span>
    <h1>体験ページの API の設定</h1>
    <label class="pass">講師の合言葉<input id="pass" type="password" autocomplete="off"><span id="passState" class="passstate"></span></label>
    <a class="back" href="./">← 戻る</a>
</header>
<main>
    <section class="panel white">
        <h2><span class="n ink">1</span>いまの状態</h2>
        <p class="now" id="now">—</p>
        <p class="status" id="nowSub">講師の合言葉を入れると、いまの設定を読みます</p>
        <div class="btns" style="margin-top:16px;"><button id="btnStop" class="rec" disabled>今すぐ止める</button><button id="btnOpen" disabled>許可する</button></div>
    </section>
    <section class="panel">
        <h2><span class="n">2</span>講師以外が使う合言葉と時間</h2>
        <label class="lb" for="shared">みんなの合言葉<small>4〜64 文字。講師の合言葉とは別のもの</small></label>
        <input id="shared" type="text" autocomplete="off">
        <div class="times">
            <div><label class="lb" for="start">使える時間の始まり</label><input id="start" type="datetime-local"></div>
            <div><label class="lb" for="end">終わり</label><input id="end" type="datetime-local"></div>
        </div>
        <label class="check"><input id="enabled" type="checkbox">講師以外が使うことを許可する</label>
        <div class="btns" style="margin-top:18px;"><button id="btnSave" class="primary" disabled>保存する</button><span class="status" id="saveStatus" style="margin:0;"></span></div>
    </section>
</main>
<script src="app.js"></script>
<script>
const p2 = (n) => String(n).padStart(2, '0');
// 時間は、このパソコンの時刻（日本時間）で見せて、サーバには ISO の文字列で送る
const toInput = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fromInput = (v) => (v ? new Date(v).toISOString() : '');
const fmt = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
let current = null;

async function settings(method, body) {
    let r;
    try {
        r = await fetch(API_BASE + 'admin/settings', { method, body: body ? JSON.stringify(body) : undefined,
            headers: body ? { 'X-Passcode': passcode(), 'Content-Type': 'application/json' } : { 'X-Passcode': passcode() } });
    } catch (e) { throw NOT_REACHED; }
    let j = null;
    try { j = await r.json(); } catch (e) { /* 中身が読めないときは番号だけで見立てる */ }
    if (!r.ok) throw new AppError(explain(r.status, j));
    return j;
}
function show(s) {
    current = s;
    $('shared').value = s.passcode; $('start').value = toInput(s.start); $('end').value = toInput(s.end); $('enabled').checked = s.enabled;
    const now = Date.now(), a = Date.parse(s.start), b = Date.parse(s.end), span = s.start && s.end ? `${fmt(s.start)}〜${fmt(s.end)}` : '';
    const why = !s.passcode ? 'みんなの合言葉がまだ決まっていません' : !s.enabled ? '止めています' : !span ? '使える時間がまだ決まっていません'
        : now < a ? `まだ始まっていません（${span}）` : now >= b ? `終わりました（${span}）` : '';
    $('now').textContent = why ? '講師以外は使えません' : '講師以外も使えます';
    $('now').className = 'now ' + (why ? 'ng' : 'ok');
    $('nowSub').className = 'status';
    $('nowSub').textContent = why || `${fmt(s.end)} まで（${span}）`;
    $('btnSave').disabled = false; $('btnStop').disabled = !s.enabled; $('btnOpen').disabled = s.enabled;
}
async function load() {
    if (!passcode()) return;
    try { show(await settings('GET')); } catch (e) { showError($('nowSub'), e); }
}
async function save(body, done) {
    $('saveStatus').className = 'status'; $('saveStatus').innerHTML = '<span class="thinking">保存しています</span>';
    try {
        show(await settings('PUT', body));
        $('saveStatus').textContent = done + '（ほかの場所に届くまで、最大1分ほどかかる）';
    } catch (e) { showError($('saveStatus'), e); }
}
$('btnSave').onclick = () => save({ passcode: $('shared').value.trim(), start: fromInput($('start').value), end: fromInput($('end').value), enabled: $('enabled').checked }, '保存しました');
$('btnStop').onclick = () => save({ ...current, enabled: false }, '止めました');
$('btnOpen').onclick = () => save({ ...current, enabled: true }, '許可しました');
$('pass').addEventListener('change', load);
load();
</script>
</body>
</html>
