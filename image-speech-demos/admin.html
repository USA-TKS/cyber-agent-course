<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体験ページの API の設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
main { grid-template-columns: 1fr; max-width: 760px; }
.row2 { display: flex; gap: 10px; }
.row2 input { flex: 1; }
.now { font-size: 30px; font-weight: 900; }
.now.ok { color: #1e8e3e; }
.now.ng { color: var(--ng); }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 600px) { .times { grid-template-columns: 1fr; } }
input[type=password], input[type=datetime-local] { width: 100%; font-family: var(--font); font-size: 18px; font-weight: 500; padding: 9px 14px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
</style>
</head>
<body>
<header>
    <span class="tag api">管理者</span>
    <h1>体験ページの API の設定</h1>
    <a class="back" href="./">← 戻る</a>
</header>
<main>
    <section class="panel">
        <h2><span class="n">1</span>Password を入れる</h2>
        <div class="row2"><input id="pass" type="password" autocomplete="off"><button id="btnLogin" class="primary">入る</button></div>
        <p class="status" id="loginStatus"></p>
    </section>
    <section class="panel white">
        <h2><span class="n ink">2</span>いまの状態</h2>
        <p class="now" id="now">—</p>
        <p class="status" id="nowSub">Password を入れると出ます</p>
    </section>
    <section class="panel">
        <h2><span class="n">3</span>使用開始時間と使用終了時間</h2>
        <div class="times">
            <div><label class="lb" for="start">使用開始時間</label><input id="start" type="datetime-local" disabled></div>
            <div><label class="lb" for="end">使用終了時間</label><input id="end" type="datetime-local" disabled></div>
        </div>
        <div class="btns" style="margin-top:18px;"><button id="btnSave" class="primary" disabled>保存する</button><span class="status" id="saveStatus" style="margin:0;"></span></div>
    </section>
</main>
<script src="app.js"></script>
<script>
const p2 = (n) => String(n).padStart(2, '0');
// 時間は、このパソコンの時刻（日本時間）で見せて、サーバには ISO の文字列で送る
const toInput = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fromInput = (v) => (v ? new Date(v).toISOString() : '');
const fmt = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
let current = null;

async function settings(method, body) {
    let r;
    try {
        r = await fetch(API_BASE + 'admin/settings', { method, body: body ? JSON.stringify(body) : undefined,
            headers: withPassword(body ? { 'Content-Type': 'application/json' } : {}) });
    } catch (e) { throw NOT_REACHED; }
    let j = null;
    try { j = await r.json(); } catch (e) { /* 中身が読めないときは番号だけで見立てる */ }
    if (!r.ok) throw new AppError(explain(r.status, j));
    return j;
}
// いまの状態：体験 4・5 を、いま使えるか（30秒ごとに見直す）
function showNow() {
    const s = current;
    if (!s) return;
    const now = Date.now(), a = Date.parse(s.start), b = Date.parse(s.end);
    const ok = s.start && s.end && now >= a && now < b;
    $('now').textContent = ok ? '体験4・5 を使えます' : '体験4・5 は使えません';
    $('now').className = 'now ' + (ok ? 'ok' : 'ng');
    $('nowSub').className = 'status';
    $('nowSub').textContent = !s.start || !s.end ? '使用開始時間と使用終了時間がまだ決まっていません'
        : now < a ? `使用開始時間 ${fmt(s.start)} から使えます（使用終了時間 ${fmt(s.end)}）`
        : now >= b ? `使用終了時間 ${fmt(s.end)} で終わりました（使用開始時間 ${fmt(s.start)}）`
        : `使用終了時間 ${fmt(s.end)} まで使えます（使用開始時間 ${fmt(s.start)}）`;
}
function show(s) {
    current = s;
    $('start').value = toInput(s.start); $('end').value = toInput(s.end);
    $('start').disabled = $('end').disabled = $('btnSave').disabled = false;
    showNow();
}
async function login() {
    setPassword($('pass').value.trim());
    if (!password()) return;
    $('loginStatus').className = 'status'; $('loginStatus').innerHTML = '<span class="thinking">確かめています</span>';
    try { show(await settings('GET')); $('loginStatus').textContent = '入りました'; }
    catch (e) { showError($('loginStatus'), e); }
}
$('btnLogin').onclick = login;
$('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('btnSave').onclick = async () => {
    $('saveStatus').className = 'status'; $('saveStatus').innerHTML = '<span class="thinking">保存しています</span>';
    try {
        show(await settings('PUT', { start: fromInput($('start').value), end: fromInput($('end').value) }));
        $('saveStatus').textContent = '保存しました（ほかの場所に届くまで、最大1分ほどかかる）';
    } catch (e) { showError($('saveStatus'), e); }
};
setInterval(showNow, 30000);
if (password()) { $('pass').value = password(); login(); }
</script>
</body>
</html>
