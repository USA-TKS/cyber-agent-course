<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像認識と音声認識を体験しよう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #ffffff; --ink: #1e1e1e; --muted: #555555; --accent: #f57c00; --hl: #ffe76a;
    --line: #e9e9e6; --panel: #f6f6f3; --radius: 18px;
    --font: 'Zen Maru Gothic', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 500; font-size: 18px; line-height: 1.55; }
header { padding: 18px 32px; border-bottom: 2px solid var(--line); }
header h1 { display: inline; font-size: 36px; font-weight: 900; background: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%); padding: 0 4px; }
main { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px 32px 32px; }
a.item { display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 40px 36px; border-radius: var(--radius); background: var(--panel); color: var(--ink); text-decoration: none; border: 3px solid transparent; }
a.item:hover { border-color: var(--ink); }
a.item .num { display: inline-grid; place-items: center; width: 88px; height: 88px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 44px; font-weight: 900; }
a.item h3 { min-height: 2.7em; font-size: 40px; font-weight: 900; line-height: 1.35; }
a.item p { min-height: 3.1em; font-size: 24px; color: var(--muted); }
@media (max-width: 900px) {
    header { padding: 14px 20px; }
    header h1 { font-size: 26px; }
    main { grid-template-columns: 1fr; gap: 16px; padding: 16px 20px 20px; }
    a.item { gap: 10px; padding: 22px 24px; }
    a.item .num { width: 52px; height: 52px; font-size: 26px; }
    a.item h3 { min-height: 0; font-size: 26px; }
    a.item p { min-height: 0; font-size: 18px; }
}
</style>
</head>
<body>
<header>
    <h1>画像認識と音声認識を体験しよう</h1>
</header>
<main>

    <a class="item" href="2_hand_body_detection.html"><span class="num">2</span><h3>手と体の検出</h3><p>点の位置と、グー・チョキ・パーの判定</p></a>
    <a class="item" href="3_sound_waveform.html"><span class="num">3</span><h3>音の波形とスペクトログラム</h3><p>声の模様を見る。測る回数を下げる</p></a>
</main>
</body>
</html>
