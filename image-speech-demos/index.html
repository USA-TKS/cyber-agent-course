<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像認識と音声認識を体験しよう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #ffffff; --ink: #1e1e1e; --muted: #555555; --accent: #f57c00; --accent-soft: #fff5e8; --hl: #ffe76a;
    --line: #e9e9e6; --panel: #f6f6f3; --radius: 18px;
    --font: 'Zen Maru Gothic', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 500; font-size: 18px; line-height: 1.55; }
header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 18px 32px; border-bottom: 2px solid var(--line); }
header a.slides { margin-left: auto; padding: 10px 26px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 900; text-decoration: none; }
header h1 { display: inline; font-size: 36px; font-weight: 900; background: linear-gradient(transparent 60%, var(--hl) 60%, var(--hl) 92%, transparent 92%); padding: 0 4px; }
main { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 1fr; gap: 20px; padding: 20px 32px 28px; }
a.item { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px 30px; border-radius: var(--radius); background: var(--panel); color: var(--ink); text-decoration: none; border: 3px solid transparent; }
a.item { grid-column: span 2; }
a.item.api { grid-column: span 3; }
a.item:hover { border-color: var(--ink); }
a.item.soon { opacity: .55; }
a.item.soon:not([href]) { cursor: default; border-color: transparent; }
a.item.soon p { color: var(--accent-strong); font-weight: 900; }
a.item .badge { padding: 3px 12px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 900; }
main.checking { visibility: hidden; }
a.item.api { background: var(--accent-soft); }
a.item .top { display: flex; align-items: center; gap: 12px; }
a.item .num { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 32px; font-weight: 900; }
a.item h3 { min-height: 2.7em; font-size: 30px; font-weight: 900; line-height: 1.35; }
a.item p { min-height: 3.1em; font-size: 19px; color: var(--muted); }
@media (max-width: 1100px) { main { grid-template-columns: repeat(2, 1fr); } a.item, a.item.api { grid-column: auto; } }
@media (max-width: 700px) {
    header { padding: 14px 20px; }
    header h1 { font-size: 26px; }
    main { grid-template-columns: 1fr; grid-auto-rows: auto; gap: 16px; padding: 16px 20px 20px; }
    a.item { gap: 10px; padding: 22px 24px; }
    a.item .num { width: 52px; height: 52px; font-size: 26px; }
    a.item h3 { min-height: 0; font-size: 26px; }
    a.item p { min-height: 0; font-size: 18px; }
}
</style>
</head>
<body>
<header>
    <h1>画像認識と音声認識を体験しよう</h1>
    <a class="slides" href="slides.html">スライドで進める</a>
</header>
<main class="checking">
    <a class="item" data-demo="1" href="1_image_classification.html"><div class="top"><span class="num">1</span></div><h3>画像とピクセル・画像分類</h3><p>マスの数や明るさを変えると、AIの答えはどう変わる？</p></a>
    <a class="item" data-demo="2" href="2_hand_body_detection.html"><div class="top"><span class="num">2</span></div><h3>手と体の検出</h3><p>点の位置と、グー・チョキ・パーの判定</p></a>
    <a class="item" data-demo="3" href="3_sound_waveform.html"><div class="top"><span class="num">3</span></div><h3>音の波形とスペクトログラム</h3><p>声の模様を見る。測る回数を下げる</p></a>
    <a class="item api" data-demo="4" href="4_read_image.html"><div class="top"><span class="num">4</span></div><h3>AIで写真を読み取る</h3><p>写真を撮って、AIに質問する</p></a>
    <a class="item api" data-demo="5" href="5_transcription.html"><div class="top"><span class="num">5</span></div><h3>文字起こしの実験</h3><p>雑音・測る回数・ヒントで、結果はどう変わる？</p></a>
</main>
<script src="publish.js"></script>
<script>
// 公開前の体験は「間もなく公開！」にして押せなくする（管理者の Password を入れたタブでは「公開前」の札を付けて開ける）
fetchPublished().then((list) => {
    const admin = isAdminViewer();
    if (list) document.querySelectorAll('a.item[data-demo]').forEach((a) => {
        if (list.includes(+a.dataset.demo)) return;
        a.classList.add('soon');
        if (admin) a.querySelector('.top').insertAdjacentHTML('beforeend', '<span class="badge">公開前</span>');
        else { a.removeAttribute('href'); a.querySelector('p').textContent = '間もなく公開！'; }
    });
    document.querySelector('main').classList.remove('checking');
});
</script>
</body>
</html>
