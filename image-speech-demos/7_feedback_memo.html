<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意見メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
main { grid-template-columns: minmax(420px, 1.3fr) minmax(380px, 1fr); }
.q { display: flex; align-items: center; gap: 10px; margin: 16px 0 6px; font-weight: 900; font-size: 20px; }
.q .badge { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 16px; flex: none; }
.q .badge.on { background: var(--accent); }
.q small { font-weight: 500; color: var(--muted); font-size: 15px; }
textarea.memo { min-height: 110px; }
ol.ideas { list-style: none; display: grid; gap: 12px; counter-reset: q; margin-top: 12px; }
ol.ideas li { counter-increment: q; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 14px; background: var(--accent-soft); border: 2px solid var(--accent); font-size: 19px; line-height: 1.55; }
ol.ideas li::before { content: counter(q); display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 900; }
ol.ideas li button { font-size: 15px; padding: 4px 12px; }
</style>
</head>
<body>
<header>
    <span class="tag">体験7</span>
    <h1>意見メモ</h1>
    <span class="note">書いたものは、このブラウザに残る（「AIに聞く」を押したときだけ OpenAI に送る）</span>
    <span class="total" id="total">使った料金の合計 …</span>
    <a class="back" href="./">← 戻る</a>
</header>
<main>
    <section class="panel">
        <h2><span class="n">1</span>もらった意見を書く</h2>
        <label class="lb" for="title">作品名</label><input id="title" type="text" placeholder="例：ゴミ分別アプリ">
        <label class="q" for="feel"><span class="badge">1</span>使ってどう思ったか<small>よかった所・迷った所</small></label>
        <textarea id="feel" class="memo" placeholder="例：録音ボタンが大きくて、すぐ分かった／最初の画面で何をするか迷った"></textarea>
        <label class="q" for="want"><span class="badge">2</span>欲しい機能<small>あったら使いたい機能</small></label>
        <textarea id="want" class="memo" placeholder="例：手を振るだけで次のページに進みたい"></textarea>
        <label class="q" for="dev"><span class="badge on">3</span>開発の仕方<small>次にどこを作る・どう試す</small></label>
        <textarea id="dev" class="memo" placeholder="例：先に最初の画面だけ作って、5人に触ってもらう"></textarea>
        <div class="btns" style="margin-top:16px;"><button id="btnSave" class="primary">💾 PCに保存</button><label class="file">保存したメモを開く<input id="fileOpen" type="file" accept=".txt,text/plain"></label><button id="btnCopy">コピー</button><button id="btnClear">書いたものを消す</button></div>
        <p class="status" id="memoStatus">書くと自動でこのブラウザに残る。「PCに保存」でテキストファイルにして持ち帰れる</p>
    </section>
    <div>
    <section class="panel white">
        <h2><span class="n ink">2</span>次にやること</h2>
        <label class="lb" for="next">次の1週間でやること<small>日付をつけて1つ</small></label>
        <textarea id="next" class="memo" placeholder="例：11月30日までに、最初の画面に使い方を1行入れる"></textarea>
    </section>
    <section class="panel">
        <h2><span class="n">3</span>AIに候補を聞く<span class="cost" style="margin-left:auto;">API</span></h2>
        <p style="font-size:17px;">メモを gpt-6-luna に送ると、次にやることの候補を3つ出す。迷ったときだけ使う</p>
        <div class="btns" style="margin-top:12px;"><button id="btnAsk" class="primary big">AIに聞く</button></div>
        <p class="status" id="status">押すたびに少し料金がかかる（1回 約0.01円）</p>
        <ol class="ideas" id="ideas"></ol>
    </section>
    </div>
</main>
<script src="app.js"></script>
<script>
const FIELDS = ['title', 'feel', 'want', 'dev', 'next'];
const KEY = 'image-speech-demos:memo:v1';
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); FIELDS.forEach((k) => { if (saved[k]) $(k).value = saved[k]; }); } catch (e) { /* 残せない環境では何もしない */ }
function save() {
    try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(FIELDS.map((k) => [k, $(k).value])))); $('memoStatus').textContent = 'このブラウザに残しました'; }
    catch (e) { $('memoStatus').textContent = 'このブラウザには残せません。「メモをコピー」で自分のメモに貼っておこう'; }
}
FIELDS.forEach((k) => $(k).addEventListener('input', save));

// 保存する形：■ の見出しごとに分ける（「保存したメモを開く」で読み戻せる）
const HEADS = [['title', '■ 作品名'], ['feel', '■ 1 使ってどう思ったか'], ['want', '■ 2 欲しい機能'], ['dev', '■ 3 開発の仕方'], ['next', '■ 次にやること']];
function memoText() {
    const d = new Date();
    return `意見メモ（${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日）\n\n` + HEADS.map(([k, h]) => `${h}\n${$(k).value.trim()}\n`).join('\n');
}
$('btnSave').onclick = () => {
    const d = new Date(), stamp = `${d.getMonth() + 1}月${d.getDate()}日`;
    const name = `意見メモ_${($('title').value.trim() || '作品').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 30)}_${stamp}.txt`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + memoText()], { type: 'text/plain;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('memoStatus').className = 'status'; $('memoStatus').textContent = `「${name}」を保存しました（ダウンロードのフォルダ）`;
};
$('fileOpen').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const text = (await f.text()).replace(/^﻿/, '').replace(/\r\n/g, '\n');
    let found = 0;
    HEADS.forEach(([k, h], i) => {
        const a = text.indexOf(h + '\n'); if (a < 0) return;
        const rest = text.slice(a + h.length + 1), next = HEADS.slice(i + 1).map(([, h2]) => rest.indexOf(h2)).filter((x) => x >= 0);
        $(k).value = (next.length ? rest.slice(0, Math.min(...next)) : rest).trim(); found += 1;
    });
    if (found) { save(); $('memoStatus').className = 'status'; $('memoStatus').textContent = `「${f.name}」を開きました`; }
    else showError($('memoStatus'), new Error('意見メモのファイルではないようです（「PCに保存」で保存したファイルを選ぶ）'));
    e.target.value = '';
};
$('btnCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(memoText()); $('memoStatus').textContent = 'コピーしました。自分のメモに貼っておこう'; }
    catch (e) { showError($('memoStatus'), new Error('コピーできませんでした。文字を選んでコピーしてください')); }
};
$('btnClear').onclick = () => {
    if (!confirm('書いたものをすべて消しますか？')) return;
    FIELDS.forEach((k) => { $(k).value = ''; }); save(); $('ideas').innerHTML = '';
};

$('btnAsk').onclick = async () => {
    const body = { title: $('title').value, feel: $('feel').value, want: $('want').value, dev: $('dev').value };
    if (!(body.feel + body.want + body.dev).trim()) { showError($('status'), new Error('先に意見を書いてください')); return; }
    $('btnAsk').disabled = true; $('status').className = 'status'; $('status').innerHTML = '<span class="thinking">考え中</span>';
    try {
        const r = await api('next', body);
        $('ideas').innerHTML = '';
        r.ideas.forEach((t) => {
            const li = document.createElement('li');
            li.appendChild(document.createTextNode(t));
            const b = document.createElement('button'); b.textContent = '使う';
            b.onclick = () => { $('next').value = t; save(); };
            li.appendChild(b); $('ideas').appendChild(li);
        });
        $('status').innerHTML = costTag(r.yen, 'この1回') + `　入力 ${r.input_tokens.toLocaleString()} ・ 出力 ${r.output_tokens.toLocaleString()} トークン`;
    } catch (e) { showError($('status'), e); }
    $('btnAsk').disabled = false;
};
</script>
</body>
</html>
