<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIで写真を読み取る</title>
<script src="publish.js" data-demo="4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
main { grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(460px, 1.6fr); }
.card img.sentimg { display: block; width: 240px; border-radius: 8px; border: 2px solid var(--line); margin-bottom: 12px; }
</style>
</head>
<body>
<header>
    <span class="tag api">体験4</span>
    <h1>AIで写真を読み取る</h1>
    <span class="note">写真は OpenAI に送られます。顔・名前は写さない</span>
    <a class="back" href="./">← 戻る</a>
</header>
<main>
    <section class="panel">
        <h2><span class="n">1</span>写真を撮る</h2>
        <div class="btns">
            <button id="btnCam" class="primary">カメラを使う</button>
            <button id="btnShot" disabled>📷 撮る</button>
            <label class="file">画像を開く<input id="file" type="file" accept="image/*"></label>
        </div>
        <video id="cam" class="cam" playsinline muted></video>
        <img id="photo" class="photo" alt="" hidden>
        <p class="status" id="camStatus">物を映して「撮る」。机の上の物をいくつか並べるのがおすすめ</p>
    </section>

    <section class="panel">
        <h2><span class="n">2</span>質問する</h2>
        <div class="chips" id="presets">
            <button>写っているものを1つずつ説明して</button>
            <button>写っている物はいくつある？</button>
            <button>写っている文字をすべて読んで</button>
            <button>指は何本立っている？</button>
        </div>
        <label class="lb" for="q">質問<small>自分で書きかえてもよい</small></label>
        <textarea id="q">写っているものを1つずつ説明して</textarea>
        <div class="btns" style="margin-top:18px;">
            <button id="btnAsk" class="primary big" disabled>読み取る</button>
        </div>
        <p class="status" id="askStatus">先に写真を撮ってください</p>
    </section>

    <section class="panel white">
        <h2><span class="n ink">3</span>AIの答え</h2>
        <div id="answers"><div class="answer wait">ここに答えが出ます</div></div>
        <div class="warn">AIが間違える写真を探そう：物の数・小さい文字・指の本数・さかさまの写真</div>
    </section>
</main>
<script src="app.js"></script>
<script>
let stream = null, image = null;
const video = $('cam');

$('btnCam').onclick = async () => {
    if (stream) { stopStream(stream); stream = null; video.srcObject = null; $('btnCam').textContent = 'カメラを使う'; $('btnShot').disabled = true; return; }
    try {
        stream = await startCamera(video);
        video.hidden = false; $('photo').hidden = true;
        $('btnCam').textContent = 'カメラを止める'; $('btnShot').disabled = false;
        $('camStatus').className = 'status'; $('camStatus').textContent = '物を映して「撮る」';
    } catch (e) { showError($('camStatus'), new Error('カメラが使えませんでした（' + e.name + '）。カメラの許可を確かめるか「画像を開く」を使ってください')); }
};
function setImage(dataURL) {
    image = dataURL;
    $('photo').src = dataURL; $('photo').hidden = false; video.hidden = true;
    $('btnAsk').disabled = false;
    $('askStatus').className = 'status'; $('askStatus').textContent = '質問を選んで「読み取る」';
}
$('btnShot').onclick = () => {
    if (!video.videoWidth) return;
    setImage(snapshot(video));
    stopStream(stream); stream = null; video.srcObject = null;
    $('btnCam').textContent = 'もう一度撮る'; $('btnShot').disabled = true;
};
$('file').onchange = async (e) => { const f = e.target.files[0]; if (f) setImage(await fileToDataURL(f)); };
[...$('presets').children].forEach((b) => (b.onclick = () => { $('q').value = b.textContent; }));

// 写真と質問を送り、答えを、できたところから少しずつ出す
$('btnAsk').onclick = async () => {
    const q = $('q').value.trim();
    if (!q || !image) return;
    $('btnAsk').disabled = true;
    $('answers').innerHTML = '';
    $('askStatus').className = 'status'; $('askStatus').innerHTML = '<span class="thinking">OpenAI に送っています</span>';
    try {
        let ans = null;
        await apiStream('ask_image', { image, question: q, detail: 'low', mode: 'text' }, (ev) => {
            if (ev.type === 'sent') {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = '<img class="sentimg" alt="送った写真"><div class="answer thinking"></div>';
                el.querySelector('img').src = ev.image;
                $('answers').appendChild(el);
                ans = el.querySelector('.answer');
            } else if (ev.type === 'delta') {
                ans.classList.remove('thinking');
                ans.appendChild(document.createTextNode(ev.text));
            } else if (ev.type === 'done') {
                ans.classList.remove('thinking');
                if (!ans.textContent) ans.textContent = ev.text;
            }
        });
        $('askStatus').textContent = '答えが合っているか、写真と見比べよう';
    } catch (e) { showError($('askStatus'), e); }
    $('btnAsk').disabled = false;
};
</script>
</body>
</html>
